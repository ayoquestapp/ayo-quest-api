apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-ayoquest
  namespace: api-ayoquest-dev
  labels:
    app: api-ayoquest
    env: dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api-ayoquest
  template:
    metadata:
      labels:
        app: api-ayoquest
        env: dev
    spec:
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: api-ayoquest
          image: IMAGE_TAG_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: api-ayoquest-db-secret
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: api-ayoquest-db-secret
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: api-ayoquest-db-secret
                  key: DB_NAME
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: api-ayoquest-db-secret
                  key: DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-ayoquest-db-secret
                  key: DB_PASSWORD
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-ayoquest-secret
                  key: SMTP_PASSWORD
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "4Gi"
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-ayoquest
  namespace: api-ayoquest-dev
  labels:
    app: api-ayoquest
    env: dev
spec:
  type: ClusterIP
  selector:
    app: api-ayoquest
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ayoquest
  namespace: api-ayoquest-dev
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: api-ayoquest.ayo-group.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-ayoquest
                port:
                  number: 80
